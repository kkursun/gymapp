# Tests and builds the app, then publishes it to GitHub Pages so it can be installed
# on a phone. A PWA is only offered for installation over HTTPS, which Pages provides.
#
# Pages is enabled and deploying from the default branch. Every branch gets the full
# build-and-test treatment; only the default branch publishes, because Pages serves one
# site and a second branch deploying to it would simply overwrite the first.
name: Deploy to GitHub Pages

on:
  push:
    # This repository's default branch is the claude/* branch it was first pushed to;
    # main/master are listed so the workflow keeps working after any rename.
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kept free of any Pages API call, so a green tick here means the code is genuinely
  # healthy whether or not Pages has been enabled yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # No configure-pages step: Vite is configured with base './', so every asset,
      # the manifest and the service worker resolve relative to wherever the app is
      # served from. Nothing needs to know the deployment URL at build time.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # The `github-pages` environment only accepts deployments from the default branch, so
    # on any other branch this job is rejected before it runs a single step — a red cross
    # that says nothing about the code. Skip it instead: a feature branch is then green
    # when `build` proves it healthy, and merging is what publishes.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
